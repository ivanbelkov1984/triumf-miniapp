<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ТРИУМФ — каталог мототехники</title>
<meta name="description" content="Каталог мотосалона ТРИУМФ в Telegram: подбор, характеристики, заявка Вадиму.">
<link rel="stylesheet" href="app.css">
<!-- Официальный SDK мини-приложений Telegram. Вне Telegram приложение работает как обычная страница. -->
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <img class="top-logo" data-logo src="../assets/brand/triumf-lockup-light.svg" width="814" height="240" alt="ТРИУМФ — мотосалон">
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Разделы">
    <a href="#/" data-tab="catalog"><span class="ti" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg></span>Каталог</a>
    <a href="#/pick" data-tab="pick"><span class="ti" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Подбор</a>
    <a href="#/fav" data-tab="fav"><span class="ti" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>Избранное<b class="badge" data-fav-count hidden></b></a>
    <a href="#/service" data-tab="service"><span class="ti" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></span>Сервис</a>
    <a href="#/contact" data-tab="contact"><span class="ti" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>Вадим</a>
    <a href="#/admin" data-tab="admin" hidden><span class="ti" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.5 7.5 0 0 0-1.7 1l-2.3-.9-2 3.4 2 1.5a7.5 7.5 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.3.9 2-3.4z"/></svg></span>Админ</a>
  </nav>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<noscript>Для каталога нужен JavaScript.</noscript>
</body>
</html>
